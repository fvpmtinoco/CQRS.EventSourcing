services:
    kafka:
      image: apache/kafka:latest
      container_name: kafka
      ports:
        - "9092:9092"   # external (host access)
        - "29092:29092" # internal (container-to-container)
      restart: always
      volumes:
        - kafka_data:/bitnami
      environment:
        # Unique ID for this broker node in the cluster
        KAFKA_NODE_ID: 1
      
        # This node acts as both a broker (handles messages) and controller (manages cluster state)
        # This is KRaft mode - no Zookeeper needed
        KAFKA_PROCESS_ROLES: broker,controller
      
        # Interfaces Kafka listens on:
        # PLAINTEXT - internal container-to-container on port 29092
        # CONTROLLER - KRaft controller communication on port 9093
        # EXTERNAL - host machine access on port 9092
        KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      
        # Addresses Kafka advertises to clients after initial connection:
        # PLAINTEXT - other containers use "kafka:29092"
        # EXTERNAL - host machine uses "localhost:9092"
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      
        # Maps each listener name to a security protocol (all plaintext here, no SSL)
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      
        # Defines which node is the KRaft controller - format is nodeId@host:port
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      
        # Tells Kafka which listener name is used for controller communication
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      
        # Listener used for broker-to-broker communication
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
        # Number of replicas for the internal __consumer_offsets topic
        # Set to 1 for single-broker setups (dev/PoC)
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      
        # Replication factor for transaction state log
        # Set to 1 for single-broker setups (dev/PoC)
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      
        # Minimum in-sync replicas for transaction state log
        # Set to 1 for single-broker setups (dev/PoC)
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
        # Delay before the broker starts rebalancing consumer groups on startup
        # Set to 0 for faster startup in dev environments
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      
    mongo-container:
        container_name: mongo-container
        image: mongo:latest
        restart: always
        ports:
          - "27017:27017"
        volumes:
          - mongodb_data_container:/data/db
          
    sqlserver:
        image: "mcr.microsoft.com/mssql/server:2022-latest"
        environment:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Password123"
          MSSQL_PID: "Express"
        ports:
          - "1433:1433"
        restart: always

volumes:
      zookeeper_data:
        driver: local
      kafka_data:
        driver: local
      mongodb_data_container:
        driver: local
   
networks:
      default:    
        name: smpost
        external: true
    
